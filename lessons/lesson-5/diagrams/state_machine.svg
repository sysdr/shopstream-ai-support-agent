.0" y="226.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">attempt 2</text><text x="830.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">same key</text><rect x="740" y="340" width="180" height="60" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="830.0" y="366.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">returns refund</text><text x="830.0" y="384.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">no new row</text><path d="M200.0,230.0 L260.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M450.0,230.0 L510.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M680.0,230.0 L740.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="681.9" y="218.0" width="56.2" height="16" fill="#fff" opacity="0.92"/><text x="710.0" y="230.0" font-size="12" fill="#71717a" text-anchor="middle">backoff</text><path d="M830.0,260.0 L830.0,340.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="778.8" y="288.0" width="102.4" height="16" fill="#fff" opacity="0.92"/><text x="830.0" y="300.0" font-size="12" fill="#71717a" text-anchor="middle">UNIQUE key hit</text><text x="40" y="460" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">Without the idempotency key this path would refund twice.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>